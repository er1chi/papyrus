# Configures toolchains that moon downloads, installs, caches, and runs
# tasks with. Versions apply to every machine that runs the repo.

node:
  version: "26.1.0"
  packageManager:
    pnpm:
      version: "11.1.3"

rust:
  # Pinned by rust-toolchain.toml at the repo root; Cargo is the
  # source of truth for the Rust toolchain. moon defers to it.
  version: "1.98.1"

# Unversioned tools run from the host environment (rustc, cargo, git, etc.).
# Add entries here if a task needs a specific binary pinned via proto.
system: {}
