$schema: 'https://moonrepo.dev/schemas/project.json'

# Static site for papyrus.dev. Layer application: it ships to users.
language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['marketing', 'vite']

tasks:
  dev:
    command: 'pnpm dev'
    options:
      persistent: true

  build:
    command: 'pnpm build'
    inputs:
      - 'src'
      - 'index.html'
      - 'tsconfig.json'
      - 'package.json'
    outputs:
      - 'dist'

  typecheck:
    command: 'pnpm typecheck'
