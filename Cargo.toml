[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/daemon",
    "apps/scribe",
    "crates/protocol",
    "crates/host",
    "crates/runtime",
    "crates/plugin-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/andromeda-u/papyrus"

[workspace.dependencies]
papyrus-protocol = { path = "crates/protocol" }
papyrus-host = { path = "crates/host" }
papyrus-runtime = { path = "crates/runtime" }
papyrus-plugin-host = { path = "crates/plugin-host" }
gpui = "0.2.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
